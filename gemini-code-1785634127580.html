<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROMPT SHOP AI - Video to Prompt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Video to Prompt AI</h1>
      <p>Envie um vídeo do TikTok/Reels e receba o prompt detalhado para recriar o conteúdo.</p>
    </header>

    <main>
      <section class="upload-section">
        <label for="videoInput" class="drop-zone">
          <span>📁 Clique ou arraste o vídeo aqui (MP4, MOV)</span>
          <input type="file" id="videoInput" accept="video/*">
        </label>
        
        <video id="videoPreview" controls style="display: none;"></video>
        
        <button id="btnAnalyze" disabled>Analisar Vídeo e Gerar Prompt</button>
      </section>

      <section class="result-section">
        <div id="statusMessage"></div>
        <div id="promptOutput" class="output-box" style="display: none;"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
